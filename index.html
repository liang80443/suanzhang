<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>算账 — 你的时间值多少钱？</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #333; line-height: 1.6; }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }

    /* Header */
    .header { text-align: center; padding: 40px 20px 30px; }
    .header h1 { font-size: 2em; margin-bottom: 8px; }
    .header p { color: #666; font-size: 1.1em; }

    /* Nav */
    .nav { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
    .nav button { padding: 10px 20px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1em; transition: all 0.2s; }
    .nav button:hover { border-color: #4a6cf7; color: #4a6cf7; }
    .nav button.active { background: #4a6cf7; color: white; border-color: #4a6cf7; }

    /* Card */
    .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h2 { font-size: 1.3em; margin-bottom: 16px; color: #1a1a1a; }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95em; }
    .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1em; transition: border-color 0.2s; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #4a6cf7; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    /* Button */
    .btn { width: 100%; padding: 14px; background: #4a6cf7; color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #3a5ce5; }

    /* Result */
    .result { display: none; }
    .result.show { display: block; }
    .result-total { text-align: center; padding: 20px; margin: 16px 0; background: linear-gradient(135deg, #4a6cf7, #6a8cff); border-radius: 12px; color: white; }
    .result-total .amount { font-size: 2.5em; font-weight: 800; }
    .result-total .label { font-size: 0.95em; opacity: 0.9; }
    .result-table { width: 100%; border-collapse: collapse; }
    .result-table th, .result-table td { padding: 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
    .result-table th { color: #888; font-weight: 500; font-size: 0.9em; }
    .result-table .amount { font-weight: 700; color: #4a6cf7; font-size: 1.1em; }
    .rate-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.85em; font-weight: 600; }
    .rate-150 { background: #fff3cd; color: #856404; }
    .rate-200 { background: #ffd6dd; color: #a71d2a; }
    .rate-300 { background: #f8d7da; color: #721c24; }

    /* Tips */
    .tips { background: #f8f9ff; border-left: 4px solid #4a6cf7; padding: 16px; margin-top: 16px; border-radius: 0 8px 8px 0; }
    .tips h3 { font-size: 0.95em; margin-bottom: 8px; color: #4a6cf7; }
    .tips li { font-size: 0.9em; color: #555; margin-bottom: 4px; margin-left: 16px; }

    /* Claims */
    .claim-item { padding: 16px; margin-bottom: 8px; background: #fafbff; border-radius: 8px; border-left: 4px solid #4a6cf7; }
    .claim-item .claim-title { font-weight: 700; font-size: 1.05em; }
    .claim-item .claim-formula { color: #666; font-size: 0.9em; margin: 4px 0; }
    .claim-item .claim-amount { font-size: 1.4em; font-weight: 800; color: #4a6cf7; }
    .claim-item .claim-note { color: #999; font-size: 0.85em; margin-top: 4px; }
    .claim-item .claim-basis { color: #888; font-size: 0.85em; font-style: italic; }

    /* Disclaimer */
    .disclaimer { text-align: center; padding: 20px; color: #999; font-size: 0.85em; margin-top: 20px; }
    .disclaimer a { color: #4a6cf7; text-decoration: none; }

    /* Responsive */
    @media (max-width: 600px) {
      .header h1 { font-size: 1.6em; }
      .form-row, .form-row-3 { grid-template-columns: 1fr; }
      .nav button { padding: 8px 14px; font-size: 0.9em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💰 算账</h1>
      <p>你的时间值多少钱？来算算。</p>
    </div>

    <div class="nav">
      <button class="active" onclick="switchTab('overtime')">⏰ 加班费</button>
      <button onclick="switchTab('severance')">👋 离职补偿</button>
      <button onclick="switchTab('insurance')">🏥 社保公积金</button>
    </div>

    <!-- 加班费计算器 -->
    <div id="tab-overtime" class="tab-content">
      <div class="card">
        <h2>⏰ 加班费计算器</h2>
        <div class="form-group">
          <label>月薪基数（元）</label>
          <input type="number" id="ot-salary" placeholder="输入你的税前月薪" value="10000">
        </div>
        <div class="form-row-3">
          <div class="form-group">
            <label>工作日延长（小时）</label>
            <input type="number" id="ot-weekday" placeholder="0" value="10">
          </div>
          <div class="form-group">
            <label>休息日（小时）</label>
            <input type="number" id="ot-weekend" placeholder="0" value="8">
          </div>
          <div class="form-group">
            <label>法定节假日（小时）</label>
            <input type="number" id="ot-holiday" placeholder="0" value="4">
          </div>
        </div>
        <button class="btn" onclick="calcOvertime()">算算</button>
      </div>
      <div id="ot-result" class="result"></div>
    </div>

    <!-- 离职补偿计算器 -->
    <div id="tab-severance" class="tab-content" style="display:none">
      <div class="card">
        <h2>👋 离职补偿计算器</h2>
        <div class="form-row">
          <div class="form-group">
            <label>月薪基数（元）</label>
            <input type="number" id="sv-salary" placeholder="税前月薪" value="15000">
          </div>
          <div class="form-group">
            <label>工作年限（年）</label>
            <input type="number" id="sv-years" placeholder="如 3.5 = 3年6个月" value="3.5" step="0.5">
          </div>
        </div>
        <div class="form-group">
          <label>离职原因</label>
          <select id="sv-reason">
            <option value="dismissal">公司辞退（经济补偿 N）</option>
            <option value="mutual">协商解除（经济补偿 N）</option>
            <option value="illegal" selected>违法解除（赔偿金 2N）</option>
            <option value="expire">合同到期公司不续签（经济补偿 N）</option>
            <option value="resign">主动辞职（一般无补偿）</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label><input type="checkbox" id="sv-contract" checked> 有书面劳动合同</label>
          </div>
          <div class="form-group">
            <label><input type="checkbox" id="sv-insurance" checked> 公司缴纳社保</label>
          </div>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="sv-notice" checked> 公司提前 30 天通知</label>
        </div>
        <button class="btn" onclick="calcSeverance()">算算</button>
      </div>
      <div id="sv-result" class="result"></div>
    </div>

    <!-- 社保公积金计算器 -->
    <div id="tab-insurance" class="tab-content" style="display:none">
      <div class="card">
        <h2>🏥 社保公积金计算器</h2>
        <div class="form-row">
          <div class="form-group">
            <label>月薪（元）</label>
            <input type="number" id="si-salary" placeholder="税前月薪" value="10000">
          </div>
          <div class="form-group">
            <label>所在城市</label>
            <select id="si-region">
              <option value="zhengzhou">郑州</option>
              <option value="beijing">北京</option>
              <option value="shanghai">上海</option>
              <option value="shenzhen">深圳</option>
              <option value="guangzhou">广州</option>
              <option value="hangzhou">杭州</option>
            </select>
          </div>
        </div>
        <button class="btn" onclick="calcInsurance()">算算</button>
      </div>
      <div id="si-result" class="result"></div>
    </div>

    <div class="disclaimer">
      <p>⚠️ 本工具计算结果仅供参考，不构成法律建议</p>
      <p>遇到劳动争议 → 劳动监察大队投诉 → 劳动仲裁（免费） → 专业律师</p>
      <p>开源项目：<a href="https://gitee.com/liang6/suanzhang" target="_blank">Gitee</a> | 欢迎提交 PR 补充你所在城市的数据 💪</p>
    </div>
  </div>

  <script>
    // === 核心计算逻辑（与 src/calculators 同步） ===

    function switchTab(name) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + name).style.display = 'block';
      event.target.classList.add('active');
    }

    function formatMoney(n) {
      if (n === null || n === undefined) return '需向社保局申请';
      return '¥' + n.toLocaleString();
    }

    // 加班费计算
    function calcOvertime() {
      const salary = Number(document.getElementById('ot-salary').value) || 0;
      const weekday = Number(document.getElementById('ot-weekday').value) || 0;
      const weekend = Number(document.getElementById('ot-weekend').value) || 0;
      const holiday = Number(document.getElementById('ot-holiday').value) || 0;

      if (salary <= 0) { alert('请输入月薪'); return; }

      const hourly = salary / 21.75 / 8;
      const details = [];
      if (weekday > 0) details.push({ type: '工作日延长', hours: weekday, rate: 150, amount: Math.round(hourly * weekday * 1.5) });
      if (weekend > 0) details.push({ type: '休息日', hours: weekend, rate: 200, amount: Math.round(hourly * weekend * 2) });
      if (holiday > 0) details.push({ type: '法定节假日', hours: holiday, rate: 300, amount: Math.round(hourly * holiday * 3) });
      const total = details.reduce((s, d) => s + d.amount, 0);

      const rateClass = r => r === 150 ? 'rate-150' : r === 200 ? 'rate-200' : 'rate-300';

      document.getElementById('ot-result').innerHTML = `
        <div class="result show">
          <div class="result-total">
            <div class="label">你的加班费</div>
            <div class="amount">${formatMoney(total)}</div>
            <div class="label">时薪 ¥${hourly.toFixed(2)}（月薪÷21.75÷8）</div>
          </div>
          <div class="card">
            <h2>明细</h2>
            <table class="result-table">
              <tr><th>类型</th><th>时长</th><th>倍率</th><th class="amount">金额</th></tr>
              ${details.map(d => `
                <tr>
                  <td>${d.type}</td>
                  <td>${d.hours} 小时</td>
                  <td><span class="rate-tag ${rateClass(d.rate)}">${d.rate}%</span></td>
                  <td class="amount">${formatMoney(d.amount)}</td>
                </tr>
              `).join('')}
              <tr style="font-weight:700;border-top:2px solid #e0e0e0"><td colspan="3">合计</td><td class="amount">${formatMoney(total)}</td></tr>
            </table>
          </div>
          <div class="card">
            <div class="tips">
              <h3>💡 小贴士</h3>
              <ul>
                <li>休息日加班可安排补休，不补休的需支付 200% 加班费</li>
                <li>法定节假日加班必须支付 300%，不能用补休替代</li>
                <li>加班费计算基数为税前工资，不含加班费本身</li>
                <li>保存好加班证据：打卡记录、聊天记录、邮件等</li>
              </ul>
            </div>
          </div>
        </div>`;
    }

    // 离职补偿计算
    function calcSeverance() {
      const salary = Number(document.getElementById('sv-salary').value) || 0;
      const years = Number(document.getElementById('sv-years').value) || 0;
      const reason = document.getElementById('sv-reason').value;
      const hasContract = document.getElementById('sv-contract').checked;
      const hasInsurance = document.getElementById('sv-insurance').checked;
      const hasNotice = document.getElementById('sv-notice').checked;

      if (salary <= 0 || years <= 0) { alert('请填写月薪和工作年限'); return; }

      const rounded = years % 1 === 0 ? years : (years % 1 >= 0.5 ? Math.ceil(years) : Math.floor(years) + 0.5);
      const claims = [];

      if (['dismissal', 'mutual', 'expire'].includes(reason)) {
        claims.push({ type: '经济补偿金（N）', formula: `${rounded} 个月 × ¥${salary.toLocaleString()}`, amount: Math.round(salary * rounded), basis: '《劳动合同法》第46、47条', note: '工作年限不满6个月按0.5年，满6个月按1年' });
      }
      if (['dismissal', 'mutual'].includes(reason) && !hasNotice) {
        claims.push({ type: '代通知金（+1）', formula: `1 个月 × ¥${salary.toLocaleString()}`, amount: salary, basis: '《劳动合同法》第40条', note: '仅限公司未提前30天书面通知的情况' });
      }
      if (reason === 'illegal') {
        claims.push({ type: '违法解除赔偿金（2N）', formula: `${rounded} 年 × 2 × ¥${salary.toLocaleString()}`, amount: Math.round(salary * rounded * 2), basis: '《劳动合同法》第87条', note: '2N 和 N 不能同时主张，择一较高者' });
      }
      if (!hasContract) {
        const months = Math.min(11, Math.floor(years));
        if (months > 0) claims.push({ type: '未签合同双倍工资', formula: `${months} 个月 × ¥${salary.toLocaleString()}`, amount: salary * months, basis: '《劳动合同法》第82条', note: '最多11个月，有1年仲裁时效' });
      }
      if (!hasInsurance) {
        claims.push({ type: '社保补缴', formula: '需向社保局申请', amount: null, basis: '《社会保险法》第58、60条', note: '无法直接折算为金额，可向社保局投诉（无时效限制）' });
      }

      const total = claims.filter(c => c.amount !== null).reduce((s, c) => s + c.amount, 0);

      document.getElementById('sv-result').innerHTML = `
        <div class="result show">
          <div class="result-total">
            <div class="label">你最多可主张</div>
            <div class="amount">${formatMoney(total)}</div>
          </div>
          <div class="card">
            <h2>赔偿明细</h2>
            ${claims.map(c => `
              <div class="claim-item">
                <div class="claim-title">${c.type}</div>
                <div class="claim-formula">${c.formula}</div>
                <div class="claim-amount">${formatMoney(c.amount)}</div>
                <div class="claim-note">${c.note}</div>
                <div class="claim-basis">法律依据：${c.basis}</div>
              </div>
            `).join('')}
          </div>
          <div class="card">
            <div class="tips">
              <h3>💡 小贴士</h3>
              <ul>
                <li>月薪基数以解除前12个月平均工资为准，含奖金、津贴</li>
                <li>月薪上限为当地社平工资的3倍（高薪人士适用）</li>
                <li>劳动仲裁时效为1年，从知道权利被侵害之日起算</li>
                <li>保存好：劳动合同、工资条、解除通知书、考勤记录</li>
              </ul>
            </div>
          </div>
        </div>`;
    }

    // 社保公积金计算
    function calcInsurance() {
      const salary = Number(document.getElementById('si-salary').value) || 0;
      const region = document.getElementById('si-region').value;
      if (salary <= 0) { alert('请输入月薪'); return; }

      // 城市费率数据
      const cities = {
        beijing: { name: '北京', pension: [8,16], medical: [2,9.8], unemploy: [0.5,0.5], injury: [0,0.4], maternity: [0,0.8], fund: [12,12], fundRange: [2420,35283] },
        shanghai: { name: '上海', pension: [8,16], medical: [2,9.5], unemploy: [0.5,0.5], injury: [0,0.16], maternity: [0,1], fund: [7,7], fundRange: [2690,36549] },
        shenzhen: { name: '深圳', pension: [8,16], medical: [2,5.2], unemploy: [0.3,0.7], injury: [0,0.14], maternity: [0,0.45], fund: [5,5], fundRange: [2360,27501] },
        guangzhou: { name: '广州', pension: [8,16], medical: [2,5.5], unemploy: [0.2,0.8], injury: [0,0.2], maternity: [0,0.85], fund: [5,5], fundRange: [2300,38082] },
        zhengzhou: { name: '郑州', pension: [8,16], medical: [2,8], unemploy: [0.3,0.7], injury: [0,0.2], maternity: [0,1], fund: [12,12], fundRange: [2100,28134] },
        hangzhou: { name: '杭州', pension: [8,14], medical: [2,9.5], unemploy: [0.5,0.5], injury: [0,0.2], maternity: [0,1.2], fund: [12,12], fundRange: [2490,36318] }
      };

      const c = cities[region];
      const base = Math.max(c.fundRange[0], Math.min(salary, c.fundRange[1]));
      const items = [
        { name: '养老保险', pRate: c.pension[0], cRate: c.pension[1] },
        { name: '医疗保险', pRate: c.medical[0], cRate: c.medical[1] },
        { name: '失业保险', pRate: c.unemploy[0], cRate: c.unemploy[1] },
        { name: '工伤保险', pRate: 0, cRate: c.injury[1] },
        { name: '生育保险', pRate: 0, cRate: c.maternity[1] },
        { name: '住房公积金', pRate: c.fund[0], cRate: c.fund[1], note: `基数 ¥${base.toLocaleString()}` }
      ];

      items.forEach(i => {
        i.personal = i.name === '住房公积金' ? Math.round(base * i.pRate / 100) : Math.round(salary * i.pRate / 100);
        i.company = i.name === '住房公积金' ? Math.round(base * i.cRate / 100) : Math.round(salary * i.cRate / 100);
      });

      const tp = items.reduce((s, i) => s + i.personal, 0);
      const tc = items.reduce((s, i) => s + i.company, 0);
      const takeHome = salary - tp;

      document.getElementById('si-result').innerHTML = `
        <div class="result show">
          <div class="result-total">
            <div class="label">${c.name} · 月薪 ¥${salary.toLocaleString()}</div>
            <div class="amount">到手约 ${formatMoney(takeHome)}</div>
            <div class="label">个人月缴 ${formatMoney(tp)} | 公司月缴 ${formatMoney(tc)}</div>
          </div>
          <div class="card">
            <h2>缴纳明细</h2>
            <table class="result-table">
              <tr><th>项目</th><th>个人</th><th>公司</th><th>个人费率</th><th>公司费率</th></tr>
              ${items.map(i => `
                <tr>
                  <td>${i.name}</td>
                  <td class="amount">${formatMoney(i.personal)}</td>
                  <td class="amount">${formatMoney(i.company)}</td>
                  <td>${i.pRate}%</td>
                  <td>${i.cRate}%</td>
                </tr>
              `).join('')}
              <tr style="font-weight:700;border-top:2px solid #e0e0e0">
                <td>合计</td>
                <td class="amount">${formatMoney(tp)}</td>
                <td class="amount">${formatMoney(tc)}</td>
                <td colspan="2">${formatMoney(tp + tc)}</td>
              </tr>
            </table>
          </div>
          <div class="card">
            <div class="tips">
              <h3>💡 小贴士</h3>
              <ul>
                <li>以上为 ${c.name} 参考费率，实际以当地最新政策为准</li>
                <li>到手工资为粗略估算，不含个税和专项扣除</li>
                <li>公积金基数范围 ¥${c.fundRange[0]}-¥${c.fundRange[1].toLocaleString()}</li>
                <li>如果发现实际缴纳与计算不符，可向社保局投诉</li>
                <li>你的城市不在这里？<a href="https://gitee.com/liang6/suanzhang" target="_blank" style="color:#4a6cf7">提交 PR 添加！</a></li>
              </ul>
            </div>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
